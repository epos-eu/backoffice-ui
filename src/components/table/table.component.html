<div
  class="mat-table-margin"
  *ngIf="loading"
>
  <mat-progress-bar mode="indeterminate"></mat-progress-bar>
</div>
<ng-container *ngIf="!loading">
  <app-table-filter (onFilter)="handleFilter($event)"></app-table-filter>
</ng-container>
<div
  [hidden]="loading"
  class="mat-elevation-z8 mat-table-margin"
>
  <table
    mat-table
    [dataSource]="dataSource"
    matSort
  >
    <!-- UID column -->
    <ng-container matColumnDef="uid">
      <th
        mat-header-cell
        *matHeaderCellDef
        mat-sort-header
      >
        UID
      </th>
      <td
        mat-cell
        *matCellDef="let row"
      >
        {{ row.uid }}
      </td>
    </ng-container>
    <!-- Last change column -->
    <ng-container matColumnDef="lastChange">
      <th
        mat-header-cell
        *matHeaderCellDef
        mat-sort-header
      >
        Last Change
      </th>
      <td
        mat-cell
        *matCellDef="let row"
      >
        {{ row.lastChange | date }}
      </td>
    </ng-container>
    <!-- Status column -->
    <ng-container matColumnDef="status">
      <th
        mat-header-cell
        *matHeaderCellDef
        mat-sort-header
      >
        Status
      </th>
      <td
        mat-cell
        *matCellDef="let row"
        class="column-status"
      >
        {{ row?.status }}
      </td>
    </ng-container>
    <!-- Comment column -->
    <ng-container matColumnDef="changeComment">
      <th
        mat-header-cell
        *matHeaderCellDef
        mat-sort-header
      >
        Comment
      </th>
      <td
        mat-cell
        *matCellDef="let row"
      >
        {{ row.changeComment }}
      </td>
    </ng-container>
    <!-- Author column -->
    <ng-container matColumnDef="author">
      <th
        mat-header-cell
        *matHeaderCellDef
        mat-sort-header
      >
        Author
      </th>
      <td
        mat-cell
        *matCellDef="let row"
      >
        {{ row.author }}
      </td>
    </ng-container>

    <tr
      mat-header-row
      *matHeaderRowDef="displayedColumns"
    ></tr>
    <tr
      mat-row
      *matRowDef="let row; columns: displayedColumns"
      (click)="rowClicked(row.instanceId)"
    ></tr>
    <!-- No matching data -->
    <tr
      class="mat-row"
      *matNoDataRow
    >
      <td
        class="mat-cell"
        colspan="4"
      >
        No data matching the filter
      </td>
    </tr>
  </table>
  <mat-paginator
    [pageSizeOptions]="pageSizeOptions"
    aria-label="Select page of data products"
  ></mat-paginator>
</div>
