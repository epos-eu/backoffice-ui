<h1 mat-dialog-title>{{ data['title'] }}</h1>
<div mat-dialog-content>
  <p class="body-1">{{ data['content'] }}</p>
</div>
<div mat-dialog-actions>
  <button mat-button (click)="handleCancel()">{{ data['actionCancel'] }}</button>
  <button mat-flat-button color="warn" (click)="handleConfirm()">
    {{ data['actionConfirm'] }}
  </button>
</div>
