<mat-nav-list>
  <div class="bottom">
    <div class="actions">
      <button
        *ngIf="
          activeDataProduct && (activeDataProduct.state === state.DRAFT || activeDataProduct.state === state.SUBMITTED)
        "
        mat-stroked-button
        color="primary"
        (click)="handleSave()"
        [disabled]="disableSave"
      >
        Save
      </button>
      <button
        *ngIf="
          activeDataProduct &&
          (activeDataProduct.state === state.PUBLISHED || activeDataProduct.state === state.ARCHIVED)
        "
        mat-stroked-button
        color="primary"
        (click)="handleCreateEntityFromPublishedOrArchived()"
      >
        Create New Draft From Entity
      </button>
      <button
        *ngIf="activeDataProduct && activeDataProduct.state === state.DRAFT"
        mat-flat-button
        color="primary"
        (click)="handleChangeState(state.SUBMITTED)"
      >
        Submit
      </button>
      <button
        *ngIf="activeDataProduct && activeDataProduct.state === state.SUBMITTED"
        mat-flat-button
        color="primary"
        (click)="handleChangeState(state.PUBLISHED)"
      >
        Publish
      </button>

      <button
        *ngIf="activeDataProduct && activeDataProduct.state === state.SUBMITTED"
        mat-flat-button
        color="warn"
        (click)="handleChangeState(state.DISCARDED)"
      >
        Reject
      </button>

      <button
        *ngIf="activeDataProduct && activeDataProduct.state === state.DISCARDED"
        mat-flat-button
        color="primary"
        (click)="handleChangeState(state.DRAFT)"
      >
        Revert to Draft
      </button>

      <button
        *ngIf="activeDataProduct && activeDataProduct.state === state.PUBLISHED"
        mat-flat-button
        color="warn"
        (click)="handleChangeState(state.ARCHIVED)"
      >
        Archive
      </button>
    </div>
  </div>
</mat-nav-list>
