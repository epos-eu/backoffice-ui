<div class="navbar-container">

  <!-- Top navbar -->
  <mat-toolbar class="navbar" color="primary">

    <button mat-icon-button (click)="snav.toggle()">
      <mat-icon>menu</mat-icon>
    </button>

    <img
      width="100"
      alt="EPOS Logo"
      src="assets/EPOS_logo_white_orange.png"
    />

    <a class="navbar-brand" matTooltip="Home">
      <h1>
        METADATA BackOffice
      </h1>
    </a>

    <div class="navbar-main-navigation">
      <a [routerLink]="['/browse']" routerLinkActive="active">Browse</a>
      <a [routerLink]="['/import']" routerLinkActive="active">Import</a>
      <a>Export</a>
    </div>


    <span class="navbar-spacer"></span>


    <button mat-button [matMenuTriggerFor]="userMenu">
      <mat-icon>person</mat-icon>
      <span fxShow fxHide.xs>
        {{userName}}
      </span>
    </button>

    <mat-menu #userMenu="matMenu" xPosition="before" yPosition="above" [overlapTrigger]="false">
      <a mat-menu-item [routerLink]="['/account/profile']">
        <mat-icon>person</mat-icon>
        <span>Account</span>
      </a>

      <a mat-menu-item [routerLink]="['/auth/login']">
        <mat-icon>exit_to_app</mat-icon>
        <span>Log out</span>
      </a>
    </mat-menu>

  </mat-toolbar>

  <mat-sidenav-container class="navbar-sidenav-container" autosize >
    <!-- Side nav -->
    <mat-sidenav #snav mode="side" opened="true" fixedTopGap="56" class="sidenav">
      <app-browse-navigation *ngIf="navigationType == 'browse'"></app-browse-navigation>
      <app-import-navigation *ngIf="navigationType == 'import'"></app-import-navigation>
    </mat-sidenav>

    <!-- Main content -->
    <mat-sidenav-content class="sidenav-content">

      <router-outlet></router-outlet>

    </mat-sidenav-content>
  </mat-sidenav-container>

</div>
