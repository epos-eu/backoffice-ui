<div
  class="loading-wrapper"
  *ngIf="loading"
>
  <mat-spinner></mat-spinner>
</div>
<div
  class="mat-elevation-z8"
  *ngIf="!loading"
>
  <table
    mat-table
    [dataSource]="dataSource"
    matSort
  >
    <ng-container matColumnDef="uid">
      <th
        mat-header-cell
        *matHeaderCellDef
        mat-sort-header
      >
        UID
      </th>
      <td
        mat-cell
        *matCellDef="let row"
      >
        {{ row.uid }}
      </td>
    </ng-container>

    <ng-container matColumnDef="version">
      <th
        mat-header-cell
        *matHeaderCellDef
        mat-sort-header
      >
        Version
      </th>
      <td
        mat-cell
        *matCellDef="let row"
      >
        {{ row.version ? row.version : '-' }}
      </td>
    </ng-container>

    <ng-container matColumnDef="state">
      <th
        mat-header-cell
        *matHeaderCellDef
        mat-sort-header
        class="state"
      >
        State
      </th>
      <td
        mat-cell
        *matCellDef="let row"
      >
        {{ row.state.toLowerCase() }}
      </td>
    </ng-container>

    <ng-container matColumnDef="created">
      <th
        mat-header-cell
        *matHeaderCellDef
        mat-sort-header
      >
        Created At
      </th>
      <td
        mat-cell
        *matCellDef="let row"
      >
        {{ row.created }}
      </td>
    </ng-container>

    <ng-container matColumnDef="editorId">
      <th
        mat-header-cell
        *matHeaderCellDef
        mat-sort-header
      >
        Created By
      </th>
      <td
        mat-cell
        *matCellDef="let row"
      >
        {{ row.editorId }}
      </td>
    </ng-container>

    <tr
      mat-header-row
      *matHeaderRowDef="displayedColumns"
    ></tr>
    <tr
      mat-row
      *matRowDef="let row; columns: displayedColumns"
    ></tr>

    <tr
      class="mat-row"
      *matNoDataRow
    >
      <td
        class="mat-cell"
        colspan="4"
      >
        No data matching the filter
      </td>
    </tr>
  </table>
  <mat-paginator
    [pageSizeOptions]="pageSizeOptions"
    aria-label="Select page of revisions"
  ></mat-paginator>
</div>
