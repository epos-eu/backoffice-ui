<div class="wrapper">
  <div class="flex-col-wrapper">
    <div class="flex-wrapper">
      <div class="circle">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="icon icon-tabler icon-tabler-user-circle"
          width="64"
          height="64"
          viewBox="0 0 24 24"
          stroke-width="1.5"
          stroke="#999ec2"
          fill="none"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path
            stroke="none"
            d="M0 0h24v24H0z"
            fill="none"
          />
          <circle
            cx="12"
            cy="12"
            r="9"
          />
          <circle
            cx="12"
            cy="10"
            r="3"
          />
          <path d="M6.168 18.849a4 4 0 0 1 3.832 -2.849h4a4 4 0 0 1 3.834 2.855" />
        </svg>
      </div>
      <div class="details">
        <p class="name">{{ userDetails?.name }} {{ userDetails?.surname }}</p>
        <p class="email">{{ userDetails?.email }}</p>
      </div>
    </div>
    <mat-form-field appearance="outline">
      <mat-label>Role</mat-label>
      <mat-select [(ngModel)]="currentRole">
        <mat-option
          *ngFor="let role of userRole | keyvalue"
          [value]="role.value"
        >
          {{ role.value.toLocaleLowerCase() }}
        </mat-option>
      </mat-select>
    </mat-form-field>
  </div>

  <div
    mat-dialog-actions
    align="end"
  >
    <button
      mat-button
      (click)="cancel()"
    >
      Cancel
    </button>
    <button
      mat-flat-button
      color="primary"
      cdkFocusInitial
      (click)="setNewUserRole(currentRole)"
    >
      Save
    </button>
  </div>
</div>
