<div class="wrapper">
  <h2 class="mat-dialog-title">Add distribution</h2>
  <mat-dialog-actions [align]="'end'">
    <button
      mat-stroked-button
      (click)="handleClose()"
    >
      Cancel
    </button>
    <button
      mat-raised-button
      cdkFocusInitial
      color="primary"
      (click)="handleCreate()"
    >
      Create
    </button>
  </mat-dialog-actions>
</div>
