<ng-scrollbar>
  <div
    class="container"
    fxLayout="row"
    fxLayoutAlign="center none"
  >
    <h1 class="mat-headline-4">Statistics</h1>
    <div class="mat-elevation-z8 mat-table-margin">
      <table
        mat-table
        [dataSource]="dataSource"
        matSort
      >
        <!-- Entity column -->
        <ng-container matColumnDef="entity">
          <th
            mat-header-cell
            *matHeaderCellDef
            mat-sort-header
          >
            Entity
          </th>
          <td
            mat-cell
            *matCellDef="let row"
          >
            {{ row.entity }}
          </td>
        </ng-container>

        <!-- Published column -->
        <ng-container matColumnDef="published">
          <th
            mat-header-cell
            *matHeaderCellDef
            mat-sort-header
          >
            Published
          </th>
          <td
            mat-cell
            *matCellDef="let row"
          >
            {{ row.published }}
          </td>
        </ng-container>

        <!-- Submitted column -->
        <ng-container matColumnDef="submitted">
          <th
            mat-header-cell
            *matHeaderCellDef
            mat-sort-header
          >
            Submitted
          </th>
          <td
            mat-cell
            *matCellDef="let row"
          >
            {{ row.submitted }}
          </td>
        </ng-container>

        <!-- Draft column -->
        <ng-container matColumnDef="draft">
          <th
            mat-header-cell
            *matHeaderCellDef
            mat-sort-header
          >
            Draft
          </th>
          <td
            mat-cell
            *matCellDef="let row"
          >
            {{ row.draft }}
          </td>
        </ng-container>

        <tr
          mat-header-row
          *matHeaderRowDef="displayedColumns"
        ></tr>
        <tr
          mat-row
          *matRowDef="let row; columns: displayedColumns"
        ></tr>

        <!-- No matching data -->
        <tr
          class="mat-row"
          *matNoDataRow
        >
          <td
            class="mat-cell"
            colspan="4"
          >
            No data matching the filter
          </td>
        </tr>
      </table>
    </div>
    <div class="flex-wrapper">
      <app-chart
        type="bar"
        *ngFor="let group of groups"
        [data]="group"
        [options]="options"
      ></app-chart>
    </div>
  </div>
</ng-scrollbar>
