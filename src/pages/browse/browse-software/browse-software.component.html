<ng-scrollbar>
  <div class="container" fxLayout="row" fxLayoutAlign="center none">
    <h1 class="mat-display-1">Software</h1>
    <div class="mat-elevation-z8 mat-table-margin">
      <table mat-table [dataSource]="dataSource" matSort>
        <!-- Uid column -->
        <ng-container matColumnDef="uid">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>
            Uid
          </th>
          <td mat-cell *matCellDef="let row">
            {{ row._sourceObject.uid }}
          </td>
        </ng-container>

        <!-- Name column -->
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>
            Name
          </th>
          <td mat-cell *matCellDef="let row">
            {{ row._sourceObject.name }}
          </td>
        </ng-container>

        <!-- description column -->
        <ng-container matColumnDef="description">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>
            Description
          </th>
          <td mat-cell *matCellDef="let row">
            {{ row._sourceObject.description }}
          </td>
        </ng-container>

        <!-- downloadURL column
        <ng-container matColumnDef="downloadURL">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>
            Download URL
          </th>
          <td mat-cell *matCellDef="let row">
            {{ row._sourceObject.downloadURL }}
          </td>
        </ng-container> -->
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

        <!-- No matching data -->
        <tr class="mat-row" *matNoDataRow>
          <td class="mat-cell" colspan="4">
            No data matching the filter
          </td>
        </tr>
      </table>
      <mat-paginator [pageSizeOptions]="pageSizeOptions" aria-label="Select page of webservices"></mat-paginator>
    </div>
  </div>
</ng-scrollbar>
