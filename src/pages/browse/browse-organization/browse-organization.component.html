<div class="container" fxLayout="row" fxLayoutAlign="center none">
  <h1>Organization</h1>
  <div class="mat-elevation-z8 mat-table-margin">
    <table mat-table [dataSource]="dataSource" matSort>
      <!-- ID Column -->
    <ng-container matColumnDef="uid">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> uid </th>
      <td mat-cell *matCellDef="let row"> {{row.uid}} </td>
    </ng-container>

    <!-- Legal Name Column -->
    <ng-container matColumnDef="legalName">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> legalName </th>
      <td mat-cell *matCellDef="let row"> {{row.legalName}}% </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;" (click)="rowClicked(row)"></tr>

    <!-- Row shown when there is no matching data. -->
    <tr class="mat-row" *matNoDataRow>
      <td class="mat-cell" colspan="4">No data matching the filter</td>
    </tr>
    </table>
    <mat-paginator [pageSizeOptions]="[10, 25, 50, 100]" aria-label="Select page of organization"></mat-paginator>
  </div>
</div>
