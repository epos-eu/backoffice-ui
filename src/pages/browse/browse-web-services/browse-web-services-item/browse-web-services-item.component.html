<ng-scrollbar [autoHeightDisabled]="false">
  <div class="container">
    <button
      mat-stroked-button
      color="primary"
      class="back-btn"
    >
      <mat-icon>keyboard_backspace</mat-icon>
      <span class="back-label-text">Back</span>
    </button>
    <div class="top-header">
      <div class="flex-row">
        <h1 class="mat-headline-4">Webservice</h1>
        <!-- <mat-chip-listbox
          aria-label="Status"
          *ngIf="currentEdit"
        >
          <mat-chip-option [color]="currentEdit.color">{{ currentEdit.status }}</mat-chip-option>
        </mat-chip-listbox> -->
      </div>
      <div class="actions">
        <div class="flex-col">
          <button
            mat-mini-fab
            color="default"
            aria-label="Load a revision"
          >
            <mat-icon>replay</mat-icon>
          </button>
          <label>Revisions</label>
        </div>
        <div class="flex-col">
          <button
            mat-mini-fab
            color="error"
            aria-label="Delete data product"
            (click)="handleDelete()"
          >
            <mat-icon>delete</mat-icon>
          </button>
          <label>Delete</label>
        </div>
      </div>
    </div>
    <div class="body">
      <form
        [formGroup]="form"
        *ngIf="form && webservice"
      >
        <mat-form-field
          appearance="outline"
          [floatLabel]="floatLabelControl.value"
          [style.width.%]="97"
        >
          <mat-label>Instance ID</mat-label>
          <input
            matInput
            placeholder="Instance ID"
            name="instanceId"
            formControlName="instanceId"
            readonly
          />
        </mat-form-field>
        <mat-form-field
          appearance="outline"
          [floatLabel]="floatLabelControl.value"
          [style.width.%]="97"
        >
          <mat-label>Identifier</mat-label>
          <input
            matInput
            placeholder="Identifier"
            name="identifier"
            formControlName="identifier"
            readonly
          />
        </mat-form-field>
      </form>
    </div>
  </div>
</ng-scrollbar>
