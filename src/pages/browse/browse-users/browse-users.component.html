<ng-scrollbar>
  <div class="container" fxLayout="row" fxLayoutAlign="center none">
    <h1 class="mat-display-1">Users</h1>
    <div class="mat-elevation-z8 mat-table-margin">
      <table mat-table [dataSource]="dataSource" matSort>
        <!-- Name column -->
        <ng-container matColumnDef="Name">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>
            Name
          </th>
          <td mat-cell *matCellDef="let row">
            {{ row.cells[0].value }}
          </td>
        </ng-container>

        <!-- Surname column -->
        <ng-container matColumnDef="Surname">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>
            Surname
          </th>
          <td mat-cell *matCellDef="let row">
            {{ row.cells[1].value }}
          </td>
        </ng-container>

        <!-- Email column -->
        <ng-container matColumnDef="Email">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>
            Email
          </th>
          <td mat-cell *matCellDef="let row" class="column-status">
            {{ row.cells[2].value }}
          </td>
        </ng-container>

        <!-- Role column -->
        <ng-container matColumnDef="Role">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>
            Role
          </th>
          <td mat-cell *matCellDef="let row">
            {{ row.cells[3].value }}
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns" (click)="rowClicked(row)"></tr>

        <!-- No matching data -->
        <tr class="mat-row" *matNoDataRow>
          <td class="mat-cell" colspan="4">
            No data matching the filter
          </td>
        </tr>
      </table>
      <mat-paginator [pageSizeOptions]="pageSizeOptions" aria-label="Select page of data products"></mat-paginator>
    </div>
  </div>
</ng-scrollbar>
