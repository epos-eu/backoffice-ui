<ng-scrollbar>
  <div class="container">
    <h1 class="mat-headline-4">Users</h1>
    <div
      class="mat-table-margin"
      *ngIf="loading"
    >
      <mat-progress-bar mode="indeterminate"></mat-progress-bar>
    </div>
    <div
      [hidden]="loading"
      class="mat-elevation-z8 mat-table-margin"
    >
      <table
        mat-table
        [dataSource]="dataSource"
        matSort
      >
        <!-- Name column -->
        <ng-container matColumnDef="name">
          <th
            mat-header-cell
            *matHeaderCellDef
            mat-sort-header
          >
            Name
          </th>
          <td
            mat-cell
            *matCellDef="let row"
          >
            {{ row.name }}
          </td>
        </ng-container>

        <!-- Surname column -->
        <ng-container matColumnDef="surname">
          <th
            mat-header-cell
            *matHeaderCellDef
            mat-sort-header
          >
            Surname
          </th>
          <td
            mat-cell
            *matCellDef="let row"
          >
            {{ row.surname }}
          </td>
        </ng-container>

        <!-- Email column -->
        <ng-container matColumnDef="email">
          <th
            mat-header-cell
            *matHeaderCellDef
            mat-sort-header
          >
            Email
          </th>
          <td
            mat-cell
            *matCellDef="let row"
            class="column-status"
          >
            {{ row.email }}
          </td>
        </ng-container>

        <!-- Role column -->
        <ng-container matColumnDef="role">
          <th
            mat-header-cell
            *matHeaderCellDef
            mat-sort-header
          >
            Role
          </th>
          <td
            mat-cell
            *matCellDef="let row"
          >
            {{ row.role }}
          </td>
        </ng-container>

        <tr
          mat-header-row
          *matHeaderRowDef="displayedColumns"
        ></tr>
        <tr
          mat-row
          *matRowDef="let row; columns: displayedColumns"
          (click)="rowClicked(row)"
        ></tr>

        <!-- No matching data -->
        <tr
          class="mat-row"
          *matNoDataRow
        >
          <td
            class="mat-cell"
            colspan="4"
          >
            No data matching the filter
          </td>
        </tr>
      </table>
      <mat-paginator
        [pageSizeOptions]="pageSizeOptions"
        aria-label="Select page of data products"
      ></mat-paginator>
    </div>
  </div>
</ng-scrollbar>
