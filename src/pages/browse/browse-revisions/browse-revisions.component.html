<div class="container">
  <app-back-button [path]="'/browse/dataproduct/details/' + referrerId"></app-back-button>
  <div
    class="top-header"
    *ngIf="!error"
  >
    <div class="flex-row">
      <h1 class="mat-headline-4">Revisions</h1>
    </div>
  </div>
  <div
    class="mat-table-margin"
    *ngIf="loading"
  >
    <mat-progress-bar mode="indeterminate"></mat-progress-bar>
  </div>
  <div
    class="flex-wrapper"
    *ngIf="!loading"
  >
    <ng-container *ngIf="!error">
      <div class="labels">
        <div class="flex-horizontal">
          <div class="box previous">
            <p>Previous</p>
          </div>
          <p>v1.0.0</p>
        </div>
        <div class="flex-horizontal">
          <div class="box current">
            <p>Current</p>
          </div>
          <p>v1.0.1</p>
        </div>
      </div>
      <div [innerHTML]="visualDiff"></div>
    </ng-container>
    <ng-container *ngIf="error">
      <app-error-notice></app-error-notice>
    </ng-container>
  </div>
</div>
