<form
  [formGroup]="form"
  *ngIf="form"
  class="distribution"
>
  <ng-container *ngIf="distributionDetails.length > 1">
    <mat-tab-group
      [mat-stretch-tabs]="false"
      [animationDuration]="0"
      class="distribution"
    >
      <div formArrayName="distributions">
        <ng-container
          *ngFor="let child of getControls('distributions'); let i = index"
          [formGroupName]="i"
        >
          <mat-tab [label]="distributionDetails[i].title?.[0]!">
            <ng-scrollbar>
              <ng-template
                [ngTemplateOutlet]="singleDistribution"
                [ngTemplateOutletContext]="{
                  distribution: child,
                  distributionObj: distributionDetails[i]
                }"
              ></ng-template>
            </ng-scrollbar>
          </mat-tab>
        </ng-container>
      </div>
    </mat-tab-group>
  </ng-container>
  <ng-container *ngIf="distributionDetails.length === 1">
    <ng-template
      [ngTemplateOutlet]="singleDistribution"
      [ngTemplateOutletContext]="{
        distribution: getControls('distributions')[0],
        distributionObj: distributionDetails[0]
      }"
    ></ng-template>
  </ng-container>
</form>

<ng-template
  #singleDistribution
  let-distribution="distribution"
  let-distributionObj="distributionObj"
>
  <mat-form-field
    appearance="fill"
    [floatLabel]="floatLabelControl.value"
    [style.width.%]="100"
  >
    <mat-label>Title</mat-label>
    <input
      matInput
      placeholder="Title"
      name="title"
      [formControl]="distribution.get('title')"
    />
  </mat-form-field>
  <mat-form-field
    appearance="fill"
    [floatLabel]="floatLabelControl.value"
  >
    <mat-label>Description</mat-label>
    <textarea
      matInput
      name="description"
      [ngStyle]="{ 'line-height': '1.4' }"
      [formControl]="distribution.get('description')"
      [value]="distribution.get('description')"
      [disabled]="true"
    ></textarea>
  </mat-form-field>
  <mat-form-field
    appearance="fill"
    [floatLabel]="floatLabelControl.value"
    [style.width.%]="100"
  >
    <mat-label>Licence</mat-label>
    <input
      matInput
      placeholder="Licence"
      name="licence"
      [formControl]="distribution.get('licence')"
    />
  </mat-form-field>
  <p class="title-larger">Data access</p>
  <mat-radio-group [formControl]="distribution.get('dataAccess')">
    <mat-radio-button
      *ngFor="let type of dataAccessTypes"
      [value]="type['value']"
    >
      {{ type['label'] }}
    </mat-radio-button>
  </mat-radio-group>
  <ng-container *ngIf="distribution?.get('dataAccess')?.value === 'download'">
    <app-distribution-download
      [urlInvalid]="distribution?.get('downloadURL')?.invalid"
      [distribution]="distributionObj"
    ></app-distribution-download>
  </ng-container>
  <ng-container *ngIf="distribution?.get('dataAccess')?.value === 'webservice'">
    <app-distribution-webservice
      [accessService]="distributionObj.accessService"
      [accessURL]="distributionObj.accessURL"
    ></app-distribution-webservice>
  </ng-container>
  <div class="actions">
    <button
      mat-raised-button
      color="primary"
      (click)="handleSave()"
    >
      Save Distribution
    </button>
    <button
      mat-stroked-button
      color="warn"
      (click)="handleDelete(distributionObj[0].instanceId)"
    >
      <mat-icon>delete</mat-icon>
      Delete Distribution
    </button>
  </div>
</ng-template>
