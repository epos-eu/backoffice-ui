<ng-scrollbar [autoHeightDisabled]="false">
  <div class="container">
    <!-- <app-back-button path="/browse/{{ entityRoute }}"></app-back-button> -->
    <div class="top-header">
      <div class="flex-row">
        <p>
          <strong>{{ contactPoint?.uid }}</strong>
        </p>
        <!-- <mat-chip-listbox
          aria-label="Status"
          *ngIf="currentEdit"
        >
          <mat-chip-option [color]="currentEdit.color">{{ currentEdit.state }}</mat-chip-option>
        </mat-chip-listbox> -->
      </div>
      <div class="actions">
        <div class="flex-col">
          <button
            mat-mini-fab
            color="default"
            aria-label="Load a revision"
            (click)="handleGetRevisions()"
          >
            <mat-icon>replay</mat-icon>
          </button>
          <label>Revisions</label>
        </div>
        <!-- <div class="flex-col">
          <button
            mat-mini-fab
            color="error"
            aria-label="Delete operation"
            (click)="handleDelete()"
          >
            <mat-icon>delete</mat-icon>
          </button>
          <label>Delete</label>
        </div> -->
      </div>
    </div>
    <div class="body">
      <form
        [formGroup]="form"
        *ngIf="form && contactPoint"
      >
        <mat-form-field
          appearance="outline"
          [floatLabel]="floatLabelControl.value"
          [style.width.%]="97"
        >
          <mat-label>Instance ID</mat-label>
          <input
            matInput
            placeholder="Instance ID"
            name="instanceId"
            formControlName="instanceId"
            readonly
          />
        </mat-form-field>
        <mat-form-field
          appearance="outline"
          [floatLabel]="floatLabelControl.value"
          [style.width.%]="97"
        >
          <mat-label>UID</mat-label>
          <input
            matInput
            placeholder="UID"
            name="uid"
            formControlName="uid"
          />
        </mat-form-field>
        <mat-form-field
          appearance="outline"
          [floatLabel]="floatLabelControl.value"
          [style.width.%]="97"
        >
          <mat-label>Operation</mat-label>
          <input
            matInput
            placeholder="Operation"
            name="operation"
            formControlName="operation"
          />
        </mat-form-field>
      </form>
      <button
        mat-stroked-button
        color="primary"
        (click)="handleSave()"
        [disabled]="null == contactPoint"
      >
        Save
      </button>
    </div>
  </div>
</ng-scrollbar>
