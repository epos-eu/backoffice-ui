<ng-container *ngIf="!loading">
  <div class="wrapper">
    <ng-container *ngFor="let detail of mergedDetails">
      <span>{{ detail?.email }}</span>
      <span> - </span>
      <span>Role: {{ getRoleName(detail?.role) }}</span>
    </ng-container>
  </div>
</ng-container>
<ng-container *ngIf="loading">Loading...</ng-container>
