<ng-container *ngIf="temporalLinkedEntities; else empty">
  <form
    [formGroup]="form"
    *ngIf="form"
  >
    <div
      class="fields-flex-col"
      formArrayName="coverage"
    >
      <ng-container
        *ngFor="let control of getControls('coverage'); let i = index"
        [formGroupName]="i"
      >
        <mat-form-field
          appearance="fill"
          [style.width.%]="100"
        >
          <mat-label>Start date</mat-label>
          <mtx-datetimepicker #pickerStartDate></mtx-datetimepicker>
          <input
            [mtxDatetimepicker]="pickerStartDate"
            formControlName="startDate"
            matInput
            required
          />
          <mtx-datetimepicker-toggle
            [for]="pickerStartDate"
            matSuffix
          ></mtx-datetimepicker-toggle>
        </mat-form-field>
        <mat-form-field
          appearance="fill"
          [style.width.%]="100"
        >
          <mat-label>End date</mat-label>
          <mtx-datetimepicker #pickerEndDate></mtx-datetimepicker>
          <input
            [mtxDatetimepicker]="pickerEndDate"
            formControlName="endDate"
            matInput
          />
          <mtx-datetimepicker-toggle
            [for]="pickerEndDate"
            matSuffix
          ></mtx-datetimepicker-toggle>
        </mat-form-field>
        <button
          mat-mini-fab
          color="primary"
          aria-label="Save Spatial Extent"
          matTooltip="Save Spatial Extent"
          (click)="handleSave(i)"
          [disabled]="form.pristine"
        >
          <mat-icon>save</mat-icon>
        </button>
      </ng-container>
    </div>
    <span class="warnings">
      <mat-hint>
        <mat-icon>warning</mat-icon> If no end date is provided, it is assumed that this dataset is acquired
        continuously.
      </mat-hint>
      <mat-error *ngIf="form.invalid"> <mat-icon>warning</mat-icon> End date must be after Start Date</mat-error>
    </span>
  </form>
</ng-container>
<ng-template #empty>
  <p class="notice">Couldn't fetch temporal coverage data.</p>
</ng-template>
