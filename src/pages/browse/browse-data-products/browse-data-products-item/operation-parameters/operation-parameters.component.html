<ng-container *ngIf="fetchingOperation">
  <mat-spinner [diameter]="35"></mat-spinner>
</ng-container>
<ng-container *ngIf="!fetchingOperation">
  <form
    [formGroup]="paramsForm"
    *ngIf="paramsForm && mapping"
    class="operation-params"
  >
    <mat-accordion>
      <ng-container formArrayName="mapping">
        <mat-expansion-panel
          *ngFor="let control of getControls('mapping'); let i = index"
          [formGroupName]="i"
        >
          <mat-expansion-panel-header>
            <mat-panel-title>{{ control.value.variable }}</mat-panel-title>
          </mat-expansion-panel-header>
          <ng-container [ngSwitch]="control.value.range">
            <ng-container *ngSwitchCase="rangeEnum.DATE_TIME">
              <app-option-datetime
                [param]="control.value"
                [disabled]="disabled"
                (updatedParam)="this.cacheParam($event)"
              ></app-option-datetime>
            </ng-container>
            <ng-container *ngSwitchCase="rangeEnum.DATE">
              <app-option-date
                [param]="control.value"
                [disabled]="disabled"
                (updatedParam)="this.cacheParam($event)"
              ></app-option-date>
            </ng-container>
            <ng-container *ngSwitchCase="rangeEnum.STRING">
              <app-option-string
                [param]="control.value"
                [disabled]="disabled"
                (updatedParam)="this.cacheParam($event)"
              ></app-option-string>
            </ng-container>
            <ng-container *ngSwitchCase="rangeEnum.INTEGER">
              <app-option-integer
                [param]="control.value"
                [disabled]="disabled"
                (updatedParam)="this.cacheParam($event)"
              ></app-option-integer>
            </ng-container>
            <ng-container *ngSwitchCase="rangeEnum.FLOAT">
              <app-option-float
                [param]="control.value"
                [disabled]="disabled"
                (updatedParam)="this.cacheParam($event)"
              ></app-option-float>
            </ng-container>
            <ng-container *ngSwitchCase="rangeEnum.BOOLEAN">
              <app-option-boolean
                [param]="control.value"
                [disabled]="disabled"
                (updatedParam)="this.cacheParam($event)"
              ></app-option-boolean>
            </ng-container>
            <ng-container *ngSwitchCase="rangeEnum.COORDINATE">
              <app-option-coordinate
                [param]="control.value"
                [disabled]="disabled"
                (updatedParam)="this.cacheParam($event)"
              ></app-option-coordinate>
            </ng-container>
          </ng-container>
        </mat-expansion-panel>
      </ng-container>
    </mat-accordion>
  </form>
  <div class="button-wrapper">
    <div>
      <button
        class="action"
        mat-raised-button
        color="primary"
        [disabled]="disabled || disableOperationSave"
        (click)="handleSave()"
      >
        Save Operation
      </button>
      <button
        class="action"
        mat-stroked-button
        color="warn"
        (click)="deleteOperation(instanceId)"
        [disabled]="disabled"
      >
        <mat-icon>delete</mat-icon>
        Delete Operation
      </button>
    </div>
    <button
      id="param"
      mat-stroked-button
      color="primary"
      [disabled]="disabled"
      (click)="handleAddParam()"
    >
      Add Parameter
    </button>
  </div>
</ng-container>
