<ng-scrollbar [autoHeightDisabled]="false">
  <div class="body">
    <form
      [formGroup]="form"
      *ngIf="form && webservice"
    >
      <mat-form-field
        appearance="fill"
        [floatLabel]="floatLabelControl.value"
        [style.width.%]="100"
      >
        <mat-label>UID</mat-label>
        <input
          matInput
          placeholder="UID"
          name="uid"
          formControlName="uid"
        />
      </mat-form-field>
      <mat-form-field
        appearance="fill"
        [floatLabel]="floatLabelControl.value"
        [style.width.%]="100"
      >
        <mat-label>Title</mat-label>
        <input
          matInput
          placeholder="Name"
          name="name"
          formControlName="name"
        />
      </mat-form-field>
      <mat-form-field
        appearance="fill"
        [floatLabel]="floatLabelControl.value"
        [style.width.%]="100"
      >
        <mat-label>Description</mat-label>
        <textarea
          matInput
          name="description"
          [ngStyle]="{ 'line-height': '1.4' }"
          formControlName="description"
        ></textarea>
      </mat-form-field>

      <mat-form-field
        appearance="fill"
        [floatLabel]="floatLabelControl.value"
        [style.width.%]="100"
      >
        <mat-label>API Documentation (URL)</mat-label>
        <input
          matInput
          placeholder="Documentation"
          name="documentation"
          formControlName="documentation"
        />
      </mat-form-field>

      <mat-form-field>
        <mat-label>Service Provider</mat-label>
        <mat-select
          [(ngModel)]="selectedServiceProvider"
          [ngModelOptions]="{ standalone: true }"
          [compareWith]="compareWithFn"
        >
          <mat-option
            *ngFor="let provider of serviceProviders"
            [value]="provider"
          >
            {{ provider.legalName }}
          </mat-option>
        </mat-select>
      </mat-form-field>

      <mat-expansion-panel>
        <mat-expansion-panel-header>
          <mat-panel-title>Contact Point</mat-panel-title>
        </mat-expansion-panel-header>
        <mat-form-field
          class="contact-select"
          *ngIf="showContactPointSelect"
        >
          <mat-label>Select Contact Point</mat-label>
          <mat-select (selectionChange)="updateContactPointArray($event)">
            <mat-option
              *ngFor="let contactPoint of contactPointsFromCatalog"
              [value]="contactPoint"
            >
              {{ contactPoint.uid }}
            </mat-option>
          </mat-select>
        </mat-form-field>
        <div *ngFor="let detail of contactPointDetails">
          <app-contact-point-form-details [contactPointDetails]="detail"></app-contact-point-form-details>
        </div>
        <button
          mat-stroked-button
          color="primary"
          (click)="newContactPoint()"
        >
          New Contact Point
        </button>
      </mat-expansion-panel>

        appearance="outline"
        [floatLabel]="floatLabelControl.value"
        [style.width.%]="100"
      >
        <mat-label>Entry point</mat-label>
        <input
          matInput
          placeholder="Entry point"
          name="entryPoint"
          formControlName="entryPoint"
        />
      </mat-form-field>
      <mat-form-field
        appearance="outline"
        [floatLabel]="floatLabelControl.value"
        [style.width.%]="100"
      >
        <mat-label>Keywords</mat-label>
        <input
          matInput
          placeholder="Keywords"
          name="keywords"
          formControlName="keywords"
        />
      </mat-form-field>
      <mat-form-field
        appearance="outline"
        [floatLabel]="floatLabelControl.value"
        [style.width.%]="100"
      >
        <mat-label>License</mat-label>
        <input
          matInput
          placeholder="License"
          name="license"
          formControlName="license"
        />
      </mat-form-field -->
      <ng-container *ngIf="webservice.supportedOperation && webservice.supportedOperation.length > 0">
        <mat-expansion-panel [expanded]="false">
          <mat-expansion-panel-header>
            <mat-panel-title>Supported operation</mat-panel-title>
          </mat-expansion-panel-header>
          <ng-container *ngFor="let item of webservice.supportedOperation">
            <mat-form-field
              appearance="outline"
              [floatLabel]="floatLabelControl.value"
              [style.width.%]="96"
              class="indent"
            >
              <mat-label>UID</mat-label>
              <input
                matInput
                placeholder="UID"
                name="supportedOperation.uid"
                [value]="item.uid"
              />
            </mat-form-field>
            <mat-form-field
              appearance="outline"
              [floatLabel]="floatLabelControl.value"
              [style.width.%]="96"
              class="indent"
            >
              <mat-label>Entity</mat-label>
              <input
                matInput
                placeholder="Entity"
                name="supportedOperation.entityType"
                [value]="item.entityType"
                readonly
              />
            </mat-form-field>
            {{ operation | json }}
          </ng-container>
        </mat-expansion-panel>
      </ng-container>
      <ng-container *ngIf="webservice.spatialExtent && webservice.spatialExtent.length > 0">
        <mat-label class="heading">Spatial extent</mat-label>
        <ng-container *ngFor="let item of webservice.spatialExtent">
          <mat-form-field
            appearance="outline"
            [floatLabel]="floatLabelControl.value"
            [style.width.%]="96"
            class="indent"
          >
            <mat-label>Location</mat-label>
            <input
              matInput
              placeholder="Location"
              name="temporalExtent.location"
              [value]="item.location"
              readonly
            />
          </mat-form-field>
        </ng-container>
      </ng-container>
      <ng-container *ngIf="webservice.temporalExtent && webservice.temporalExtent.length > 0">
        <mat-label class="heading">Temporal extent</mat-label>
        <ng-container *ngFor="let item of webservice.temporalExtent">
          <mat-form-field
            appearance="outline"
            [floatLabel]="floatLabelControl.value"
            [style.width.%]="96"
            class="indent"
          >
            <mat-label>Start date</mat-label>
            <input
              matInput
              placeholder="Start date"
              name="temporalExtent.startDate"
              [value]="item.startDate"
              readonly
            />
          </mat-form-field>
          <mat-form-field
            appearance="outline"
            [floatLabel]="floatLabelControl.value"
            [style.width.%]="96"
            class="indent"
          >
            <mat-label>End date</mat-label>
            <input
              matInput
              placeholder="End date"
              name="temporalExtent.endDate"
              [value]="item.endDate"
              readonly
            />
          </mat-form-field>
        </ng-container>
      </ng-container>
      <input
        matInput
        placeholder="Instance ID"
        name="instanceId"
        formControlName="instanceId"
        readonly
        [hidden]="true"
      />
    </form>
    <button
      mat-stroked-button
      color="primary"
      (click)="handleSave()"
      [disabled]="null == webservice"
    >
      Save webservice
    </button>
  </div>
</ng-scrollbar>
