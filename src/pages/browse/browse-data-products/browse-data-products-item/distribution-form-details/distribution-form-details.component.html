  <div class="body">
    <app-anchor-navigation [identifier]="'#distgeneralinformation' + instanceId"></app-anchor-navigation>
    <form
      [formGroup]="form"
      *ngIf="form && distribution"
      class="distribution"
    >
      <mat-form-field
        appearance="fill"
        [floatLabel]="floatLabelControl.value"
        [style.width.%]="100"
      >
        <mat-label>Title</mat-label>
        <input
          matInput
          placeholder="Title"
          name="title"
          formControlName="title"
        />
      </mat-form-field>
      <mat-form-field
        appearance="fill"
        [floatLabel]="floatLabelControl.value"
      >
        <mat-label>Description</mat-label>
        <textarea
          matInput
          name="description"
          [ngStyle]="{ 'line-height': '1.4' }"
          formControlName="description"
          [value]="distribution.description[0]"
          [disabled]="true"
        ></textarea>
      </mat-form-field>
      <mat-form-field
        appearance="fill"
        [floatLabel]="floatLabelControl.value"
        [style.width.%]="100"
      >
        <mat-label>License</mat-label>
        <input
          matInput
          placeholder="Licence"
          name="licence"
          formControlName="licence"
        />
      </mat-form-field>

      <app-anchor-navigation [identifier]="'#distaccessible' + instanceId"></app-anchor-navigation>
      <div [ngClass]="{ title: true, active: selectedSection === '#distaccessible' + instanceId }">
        <label id="example-radio-group-label">Data access: </label>
      </div>
      <mat-radio-group
        #dataProductAccessibility
        aria-labelledby="example-radio-group-label"
        class="example-radio-group"
        formControlName="dataProductAccessibility"
      >
        <mat-radio-button value="download">Downloadable file (URL)</mat-radio-button>
        <mat-radio-button value="webservice">Web Service</mat-radio-button>
      </mat-radio-group>

      <ng-container *ngIf="this.form?.get('dataProductAccessibility')?.value === 'download'">
        <app-anchor-navigation [identifier]="'#distaccessibledownload' + instanceId"></app-anchor-navigation>
        <mat-form-field
          appearance="fill"
          [style.width.%]="100"
        >
          <input
            matInput
            placeholder="URL"
            formControlName="downloadURL"
          />
          <mat-error *ngIf="form.get('downloadURL')?.invalid"> URL is not valid. </mat-error>
        </mat-form-field>
        <mat-form-field
          appearance="fill"
          [style.width.%]="100"
        >
          <mat-label>Format</mat-label>
          <mat-select
            matNativeControl
            name="format"
            formControlName="format"
          >
            <mat-option
              [value]=""
              selected
            ></mat-option>
            <mat-option
              *ngFor="let format of formats"
              [value]="format.url"
            >
              {{ format.format }}
            </mat-option>
          </mat-select>
        </mat-form-field>
      </ng-container>
    </form>

    <div
      *ngIf="this.form?.get('dataProductAccessibility')?.value === 'webservice'"
      class="expansion-wrapper"
    >
      <div *ngIf="null != accessService">
        <app-anchor-navigation
          [identifier]="'#distaccessiblewebservice' + accessService.instanceId ? accessService.instanceId : ''"
        ></app-anchor-navigation>
        <mat-expansion-panel
          [expanded]="true"
          class="web-service"
        >
          <mat-expansion-panel-header
            [ngClass]="{
              active: selectedSection === '#distaccessiblewebservice' + accessService.instanceId
            }"
          >
            <mat-panel-title>Web Service</mat-panel-title>
          </mat-expansion-panel-header>
          <div class="expansion-content-wrapper">
            <button
              mat-stroked-button
              color="primary"
              (click)="newWebservice()"
              [hidden]="accessService"
            >
              New Web Service
            </button>
            <app-webservice-form-details
              [accessService]="accessService"
              [parentEntity]="entityDetails"
              [metaId]="metaId"
              [supportedOperations]="distribution ? distribution.accessURL : []"
            ></app-webservice-form-details>
          </div>
        </mat-expansion-panel>
      </div>

      <div *ngIf="null == accessService">
        <mat-expansion-panel
          [expanded]="true"
          class="web-service"
        >
          <mat-expansion-panel-header>
            <mat-panel-title>Web Service</mat-panel-title>
          </mat-expansion-panel-header>
          <div class="expansion-content-wrapper">
            <button
              mat-stroked-button
              color="primary"
              (click)="newWebservice()"
              [hidden]="accessService"
            >
              New Web Service
            </button>
          </div>
        </mat-expansion-panel>
      </div>
    </div>
    <div class="actions">
      <button
        mat-stroked-button
        color="primary"
        (click)="handleSave()"
        [disabled]="disabled || null == distribution"
      >
        Save Distribution
      </button>
      <button
        mat-stroked-button
        color="warn"
        (click)="deleteDistribution(distribution?.instanceId)"
        [disabled]="disabled || null == distribution"
      >
        <mat-icon>delete</mat-icon>
        Delete Distribution
      </button>
    </div>
  </div>
</ng-scrollbar>
