<ng-container *ngIf="form">
  <ng-container [formGroup]="form">
    <mat-tab-group
      [mat-stretch-tabs]="false"
      [animationDuration]="0"
      class="documentation"
    >
      <div formArrayName="documentations">
        <ng-container
          *ngFor="let child of getControls('documentations'); let i = index"
          [formGroupName]="i"
        >
          <mat-tab [label]="documentationEntities[i].title!">
            <mat-form-field appearance="fill">
              <mat-label>Title</mat-label>
              <input
                matInput
                formControlName="title"
                placeholder="title"
              />
            </mat-form-field>
            <mat-form-field appearance="fill">
              <mat-label>Description</mat-label>
              <textarea
                matInput
                name="description"
                [ngStyle]="{ 'line-height': '1.4' }"
                formControlName="description"
              ></textarea>
            </mat-form-field>
            <mat-form-field appearance="fill">
              <mat-label>URI</mat-label>
              <input
                matInput
                formControlName="uri"
                placeholder="Documentation URI"
              />
              <mat-error *ngIf="child.get('uri')?.invalid"> URL is not valid. </mat-error>
            </mat-form-field>
            <button
              mat-mini-fab
              color="primary"
              aria-label="Save Spatial Extent"
              matTooltip="Save Spatial Extent"
              (click)="handleSave(i)"
            >
              <mat-icon>save</mat-icon>
            </button>
          </mat-tab>
        </ng-container>
      </div>
    </mat-tab-group>
  </ng-container>
</ng-container>
