<ng-scrollbar>
  <div class="container" fxLayout="row" fxLayoutAlign="center none">
    <h1 class="mat-display-1">Data products</h1>
    <div class="mat-table-margin" *ngIf="loading">
      <mat-progress-bar mode="indeterminate"></mat-progress-bar>
    </div>
    <div [hidden]="loading" class="mat-elevation-z8 mat-table-margin">
      <table mat-table [dataSource]="dataSource" matSort>
        <ng-container matColumnDef="uid">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>
            UID
          </th>
          <td mat-cell *matCellDef="let row">
            {{ row.uid }}
          </td>
        </ng-container>

        <ng-container matColumnDef="lastChange">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>
            Last Change
          </th>
          <td mat-cell *matCellDef="let row">
            {{ row.lastChange | date }}
          </td>
        </ng-container>

        <ng-container matColumnDef="status">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>
            Status
          </th>
          <td mat-cell *matCellDef="let row" class="column-status">
            {{ row.status.toLowerCase() }}
          </td>
        </ng-container>

        <ng-container matColumnDef="comment">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>
            Comment
          </th>
          <td mat-cell *matCellDef="let row">
            {{ row.comment }}
          </td>
        </ng-container>

        <ng-container matColumnDef="author">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>
            Author
          </th>
          <td mat-cell *matCellDef="let row">
            {{ row.author }}
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns" (click)="rowClicked(row)"></tr>

        <tr class="mat-row" *matNoDataRow>
          <td class="mat-cell" colspan="4">
            No data matching the filter
          </td>
        </tr>
      </table>
      <mat-paginator [pageSizeOptions]="pageSizeOptions" aria-label="Select page of data products"></mat-paginator>
    </div>
  </div>
</ng-scrollbar>
