<ng-scrollbar>
  <div class="container" fxLayout="row" fxLayoutAlign="center none">
    <h1 class="mat-display-1">People</h1>
    <div class="mat-elevation-z8 mat-table-margin">
      <table mat-table [dataSource]="dataSource" matSort>
        <!-- ID Column -->
        <ng-container matColumnDef="uid">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>uid</th>
          <td mat-cell *matCellDef="let row">{{ row.id }}</td>
        </ng-container>

        <!-- Legal Name Column -->
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Family Name</th>
          <td mat-cell *matCellDef="let row"> {{ row.name }} </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

        <!-- Row shown when there is no matching data. -->
        <tr class="mat-row" *matNoDataRow>
          <td class="mat-cell" colspan="4">No data matching the filter</td>
        </tr>
      </table>
      <mat-paginator [pageSizeOptions]="[10, 25, 50, 100]" aria-label="Select page of organization"></mat-paginator>
    </div>
  </div>
</ng-scrollbar>
