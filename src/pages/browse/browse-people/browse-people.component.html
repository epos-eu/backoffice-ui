<ng-scrollbar>
  <div class="container" fxLayout="row" fxLayoutAlign="center none">
    <h1 class="mat-display-1">People</h1>
    <div class="mat-table-margin" *ngIf="loading">
      <mat-progress-bar mode="indeterminate"></mat-progress-bar>
    </div>
    <div class="mat-elevation-z8 mat-table-margin" *ngIf="!loading">
      <table mat-table [dataSource]="dataSource" matSort>
        <!-- UID column -->
        <ng-container matColumnDef="UID">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>
            UID
          </th>
          <td mat-cell *matCellDef="let row">
            {{ row.cells[0].value }}
          </td>
        </ng-container>

        <!-- Last change column -->
        <ng-container matColumnDef="Last Change">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>
            Last Change
          </th>
          <td mat-cell *matCellDef="let row">
            {{ row.cells[1].value | date}}
          </td>
        </ng-container>

        <!-- Status column -->
        <ng-container matColumnDef="Status">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>
            Status
          </th>
          <td mat-cell *matCellDef="let row" class="column-status">
            {{ row.cells[2].value.toLowerCase() }}
          </td>
        </ng-container>

        <!-- Comment column -->
        <ng-container matColumnDef="Comment">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>
            Comment
          </th>
          <td mat-cell *matCellDef="let row">
            {{ row.cells[3].value }}
          </td>
        </ng-container>

        <!-- Author column -->
        <ng-container matColumnDef="Author">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>
            Author
          </th>
          <td mat-cell *matCellDef="let row">
            {{ row.cells[4].value }}
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

        <!-- No matching data -->
        <tr class="mat-row" *matNoDataRow>
          <td class="mat-cell" colspan="4">
            No data matching the filter
          </td>
        </tr>
      </table>
      <mat-paginator [pageSizeOptions]="pageSizeOptions" aria-label="Select page of data products"></mat-paginator>
    </div>
  </div>
</ng-scrollbar>
