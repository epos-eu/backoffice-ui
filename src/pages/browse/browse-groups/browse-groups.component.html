<ng-scrollbar>
  <div
    class="container"
    fxLayout="row"
    fxLayoutAlign="center none"
  >
    <h1 class="mat-display-1">Groups</h1>
    <div
      class="mat-table-margin"
      *ngIf="loading"
    >
      <mat-progress-bar mode="indeterminate"></mat-progress-bar>
    </div>
    <div class="mat-elevation-z8 mat-table-margin">
      <table
        mat-table
        [dataSource]="dataSource"
        matSort
      >
        <!-- Name column -->
        <ng-container matColumnDef="name">
          <th
            mat-header-cell
            *matHeaderCellDef
            mat-sort-header
          >
            Name
          </th>
          <td
            mat-cell
            *matCellDef="let row"
          >
            {{ row.name }}
          </td>
        </ng-container>

        <!-- Description column -->
        <ng-container matColumnDef="description">
          <th
            mat-header-cell
            *matHeaderCellDef
            mat-sort-header
          >
            Description
          </th>
          <td
            mat-cell
            *matCellDef="let row"
          >
            {{ row.description }}
          </td>
        </ng-container>

        <tr
          mat-header-row
          *matHeaderRowDef="displayedColumns"
        ></tr>
        <tr
          mat-row
          *matRowDef="let row; columns: displayedColumns"
        ></tr>

        <!-- No matching data -->
        <tr
          class="mat-row"
          *matNoDataRow
        >
          <td
            class="mat-cell"
            colspan="4"
          >
            No data matching the filter
          </td>
        </tr>
      </table>
    </div>
  </div>
</ng-scrollbar>
