<ng-scrollbar>
  <div class="container">
    <h1 class="mat-headline-4">Groups</h1>
    <div class="flex-row">
      <div>
        <h3>Requests</h3>
        <p>Another table here</p>
      </div>
      <div>
        <h3>All</h3>
        <table
          mat-table
          [dataSource]="dataSource"
        >
          <ng-container matColumnDef="id">
            <th
              mat-header-cell
              *matHeaderCellDef
            >
              ID
            </th>
            <td
              mat-cell
              *matCellDef="let element"
            >
              {{ element.id }}
            </td>
          </ng-container>

          <ng-container matColumnDef="name">
            <th
              mat-header-cell
              *matHeaderCellDef
            >
              Name
            </th>
            <td
              mat-cell
              *matCellDef="let element"
            >
              {{ element.name }}
            </td>
          </ng-container>

          <ng-container matColumnDef="description">
            <th
              mat-header-cell
              *matHeaderCellDef
            >
              Description
            </th>
            <td
              mat-cell
              *matCellDef="let element"
            >
              {{ element.description }}
            </td>
          </ng-container>

          <tr
            mat-header-row
            *matHeaderRowDef="displayedColumns"
          ></tr>
          <tr
            mat-row
            *matRowDef="let row; columns: displayedColumns"
          ></tr>
        </table>
      </div>
    </div>
  </div>
</ng-scrollbar>
